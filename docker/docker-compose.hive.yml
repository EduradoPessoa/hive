# Hive (beta aberto) — um único contêiner, com o banco de dados embutido.
#
#   cd docker
#   cp .env.hive.example .env
#   # gere o segredo de sessão e cole em BETTER_AUTH_SECRET no .env:
#   #   macOS / Linux / WSL2:  openssl rand -hex 32
#   #   Windows (PowerShell):  $b = New-Object byte[] 32; [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($b); ($b | ForEach-Object { $_.ToString('x2') }) -join ''
#   docker compose -f docker-compose.hive.yml up -d --build
#
# Depois abra http://localhost:3100. A primeira compilação demora (a imagem
# traz o runtime e as CLIs dos agentes); as seguintes usam o cache.
#
# Os dados (banco, uploads, segredos locais, workspaces dos agentes) ficam no
# volume `hive-data`. Um volume nomeado, e não uma pasta do host, porque o
# PostgreSQL embutido se dá mal com as permissões de pastas montadas no Windows.
name: hive

services:
  hive:
    image: hive:beta
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: hive
    restart: unless-stopped
    # Teto de processos: o tini (PID 1 da imagem) recolhe órfãos; isto é a rede
    # de segurança caso algo ainda vaze.
    pids_limit: 2048
    ports:
      # Só na própria máquina. Para abrir na rede local, troque por "3100:3100"
      # e ajuste PAPERCLIP_PUBLIC_URL / PAPERCLIP_ALLOWED_HOSTNAMES no .env.
      - "127.0.0.1:${HIVE_PORT:-3100}:3100"
    environment:
      HOST: "0.0.0.0"
      PAPERCLIP_HOME: "/paperclip"

      # Dentro do contêiner o Hive precisa escutar em 0.0.0.0, então roda no
      # modo autenticado (login obrigatório), restrito à rede privada.
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:${HIVE_PORT:-3100}}"
      PAPERCLIP_ALLOWED_HOSTNAMES: "${PAPERCLIP_ALLOWED_HOSTNAMES:-}"

      # Telemetria: o Hive vem com ela LIGADA por padrão e envia eventos técnicos de uso ao
      # projeto original (Paperclip). Aqui ela começa desligada; para ligar, remova a linha
      # ou troque o valor por "0".
      PAPERCLIP_TELEMETRY_DISABLED: "${PAPERCLIP_TELEMETRY_DISABLED:-1}"

      # Segredo de sessão: obrigatório. Gere um valor próprio (veja acima).
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?Defina BETTER_AUTH_SECRET no arquivo .env}"

      # Chaves dos provedores de IA: opcionais para subir o Hive, necessárias
      # para os agentes trabalharem. Preencha pelo menos uma.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    volumes:
      - hive-data:/paperclip
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3100/api/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s

volumes:
  hive-data:
